services:
  - type: web
    name: furspeak-api
    runtime: python
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker backend.main:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        value: furspeak-4ddd4.firebasestorage.app
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
